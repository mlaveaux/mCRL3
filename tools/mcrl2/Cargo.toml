[workspace.package]
edition = "2024"
license = "BSL-1.0"
rust-version = "1.91.0"
version = "1.0.0"

# Add debug information to the release binaries.
[profile.release]
lto = "thin"
panic = "abort"
debug = "line-tables-only"

[workspace]
resolver = "3"
members = [
    "crates/mcrl2",
    "crates/mcrl2-macros",
    "crates/xtask",
    "lps",
    "pbes",
]

[workspace.dependencies]
clap = { version = "4.6", features = ["derive"] }
env_logger = "0.11"
itertools = "0.14"
log = "0.4"
parking_lot = "0.12"
rand = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
streaming-iterator = "0.1" 
thiserror = "2.0"
tempfile = "3.27"

# Dependencies used in procedural macros.
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "2.0", features = ["full"] }

# Dependencies used in xtask
duct = "1.1"

# The workspace libraries.
mcrl2 = { path = "crates/mcrl2" }
mcrl2-macros = { path = "crates/mcrl2-macros" }
mcrl2-sys = { git = "https://github.com/MERCorg/mCRL2-sys", rev = "5b6f5f1b8913d5a06057108ddb546db12831b6eb" }
merc_collections = { path = "../../crates/collections" }
merc_data = { path = "../../crates/data" }
merc_explore = { path = "../../crates/explore", features = ["clap"] }
merc_io = { path = "../../crates/io" }
merc_ldd = { path = "../../crates/ldd" }
merc_lts = { path = "../../crates/lts", features = ["clap"] }
merc_reduction = { path = "../../crates/reduction" }
merc_symbolic = { path = "../../crates/symbolic" }
merc_tools = { path = "../../crates/tools" }
merc_unsafety = { path = "../../crates/unsafety" }
merc_utilities = { path = "../../crates/utilities" }
merc_vpg = { path = "../../crates/vpg" }

# Use a local version of mCRL2-sys for development.
# [patch."https://github.com/MERCorg/mCRL2-sys"]
# mcrl2-sys = { path = "crates/mCRL2-sys" }