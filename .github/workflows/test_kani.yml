name: Verify with Kani

permissions:
  contents: read

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  kani:
    strategy:
      fail-fast: false
    runs-on: ubuntu-latest

    steps:
    - name: Checkout the repository
      uses: actions/checkout@v6
      with:
        submodules: true

    - name: Run Kani on merc_unsafety
      uses: model-checking/kani-github-action@v1
      with:
        working-directory: crates/unsafety

    - name: Run Kani on merc_number
      uses: model-checking/kani-github-action@v1
      with:
        working-directory: crates/number

    - name: Run Kani on merc_collections
      uses: model-checking/kani-github-action@v1
      with:
        working-directory: crates/collections

    # NOTE: crates/io is intentionally not verified here. Its `write_read_bits_roundtrips`
    # proof drives the generic `bitstream-io` Read/Write stack over a `Vec`, which makes CBMC
    # run out of memory even at a single-byte width. See the proof's doc comment.
